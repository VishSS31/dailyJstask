<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para1">Todays javascript task</p>
    <div class="line">this is first task</div>
    <div class="line">this is second task</div>
    <div class="line">this is third task</div>
    <h1>This is innomatics</h1>
    <p id="select">this is for querySelector</p>

    <span class="vii">task is completed</span>
    <span class="vii">task is completed</span>
    <span class="vii">task is completed</span>

    <h5 id="about">My hobby is playing pc games and swimming</h5>

    <script>
        document.getElementById("para1").style.backgroundColor="red";
        document.getElementById("para1").style.fontSize="20px";
        
        document.getElementsByClassName("line")[0].style.color="brown";
        document.getElementsByClassName("line")[0].style.fontSize="50px";
        document.getElementsByClassName("line")[1].style.color="voilet";
        document.getElementsByClassName("line")[1].style.fontSize="50px";
        document.getElementsByClassName("line")[2].style.color="aqua";
        document.getElementsByClassName("line")[2].style.fontSize="50px";
        

        document.getElementsByTagName("h1")[0].style.border="3px solid black";
        
        
        document.querySelector("#select").style.fontStyle = "italic";

        document.querySelectorAll(".vii")[0].style.margin="100px";
        document.querySelectorAll(".vii")[1].style.margin="100px";
        document.querySelectorAll(".vii")[2].style.margin="100px";

        document.getElementById("about").style.border = "2px solid black"
        document.getElementById("about").style.backgroundColor="aqua";
        document.getElementById("about").style.color="red";
    </script>
</body>
</html>
